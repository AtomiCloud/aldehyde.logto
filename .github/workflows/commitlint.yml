name: Commitlint

on:
  push:
    branches:
      - 'push-action/**'
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency: 
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 10
          node-version: ^26.0.0

      - name: Commitlint
        # Credit to https://stackoverflow.com/a/67365254/12514940
        # Aldehyde fork: lint only the fork's own commits. A rebase PR also carries every
        # upstream commit since the old pin, and those are upstream's to lint, not ours.
        run: |
          . fork/UPSTREAM_REF
          npx commitlint --from "${UPSTREAM_COMMIT}" --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Commitlint on PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint
